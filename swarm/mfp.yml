services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend

  server:
    image: romainlvsr/my-favorite-places-server:1.0.0
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: supersecret
      DB_NAME: postgres
      SESSION_SECRET: superlongstring
    networks:
      - backend
      - web   # réseau partagé avec Traefik
    deploy:
      replicas: 2
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.mfp.rule=Host(`mfp.swarm.localhost`)"
        - "traefik.http.routers.mfp.entrypoints=web"
        - "traefik.http.services.mfp.loadbalancer.server.port=3000"

networks:
  backend:
  web:
    external: true

volumes:
  db-data:
