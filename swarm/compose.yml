services:
  manager:
    image: docker:dind
    privileged: true
    hostname: manager
    volumes:
      - /home/manager   # volume anonyme : pérennise les fichiers de stack
    ports:
      - "80:80"   # expose Traefik (port 80 du manager) sur la machine hôte
    environment:
      DOCKER_TLS_CERTDIR: ""

  node1:
    image: docker:dind
    privileged: true
    hostname: node1
    environment:
      DOCKER_TLS_CERTDIR: ""

  node2:
    image: docker:dind
    privileged: true
    hostname: node2
    environment:
      DOCKER_TLS_CERTDIR: ""

  node3:
    image: docker:dind
    privileged: true
    hostname: node3
    environment:
      DOCKER_TLS_CERTDIR: ""

  https-proxy:
    image: alpine/socat
    command: tcp-listen:443,fork,reuseaddr tcp-connect:manager:443
    ports:
      - "443:443"   # expose le port 443 du manager (Traefik HTTPS) sur la machine hôte
