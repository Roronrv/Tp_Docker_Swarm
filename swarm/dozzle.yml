# Dozzle en mode Swarm, authentification simple (users.yml fourni par un secret)
services:
  dozzle:
    image: amir20/dozzle:latest
    environment:
      DOZZLE_MODE: swarm
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dozzle_data:/data
    secrets:
      - source: dozzle_users   # secret créé dans Portainer (contenu de users.yml)
        target: /data/users.yml
    networks:
      - dozzle
      - web
    deploy:
      mode: global   # une instance par nœud pour lire les logs de tous les conteneurs
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dozzle.rule=Host(`dozzle.swarm.localhost`)"
        - "traefik.http.routers.dozzle.entrypoints=web"
        - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
        # Les instances ne partagent pas leurs sessions : on reste sur la même instance
        - "traefik.http.services.dozzle.loadbalancer.sticky.cookie=true"

networks:
  dozzle:
    driver: overlay
  web:
    external: true

volumes:
  dozzle_data:

secrets:
  dozzle_users:
    external: true
